name: Pages

on:
  push:
    branches: [main]
    paths:
      - 'editor/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel an in-flight Pages deploy: a half-applied deployment is worse than a slow one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: editor/package-lock.json

      - name: Install
        working-directory: editor
        run: npm ci

      - name: Build
        working-directory: editor
        run: npm run build
        env:
          VITE_COMMIT: ${{ github.sha }}

      - uses: actions/configure-pages@v5

      # `path` is an action input, not a shell cwd: working-directory does not apply to it.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: editor/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
