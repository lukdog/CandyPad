# Builds the CandyPad firmware from this userspace against the pinned binepad QMK fork.
# There is no local toolchain for this project: CI is the only build verification.
name: Build QMK firmware

on:
  # No branch filter on purpose: the workflow is "download an edited keymap.json,
  # commit it on a branch, grab the .bin from that branch's run".
  push:
    paths:
      - 'keyboards/**'
      - 'qmk.json'
      - '.github/workflows/build.yml'
  pull_request:
    paths:
      - 'keyboards/**'
      - 'qmk.json'
      - '.github/workflows/build.yml'
  workflow_dispatch:
    inputs:
      userspace_ref:
        description: 'Build keyboards/ + qmk.json from this git ref instead of HEAD (e.g. pre-migration). Leave empty for HEAD.'
        required: false
        default: ''

# upload-artifact@v4 uses the runtime token, not GITHUB_TOKEN, so read is enough.
permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  QMK_FORK: binepad-global/qmk_firmware
  # Pinned SHA of sr-candykeys-candypad-rev-b (the STM32F103 revision).
  # Pin the SHA, not the branch: a fork branch can be force-pushed under us.
  QMK_REF: 58fbe52165da5fa6732e478e8733e5b716195192
  QMK_HOME: /home/runner/qmk_firmware
  # STM32F103x8 = 64K flash, minus 8K stm32duino bootloader, minus 2K wear-levelling EEPROM.
  FLASH_BUDGET: 55296

jobs:
  validate:
    name: Validate keymap.json
    runs-on: ubuntu-latest
    # TODO(ed): remove continue-on-error once editor/scripts/validate.ts lands.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # TODO(ed): frozen contract for the editor CLI:
      #   npx tsx editor/scripts/validate.ts <keymap.json> --keyboard <keyboard.json> [--allow-unreachable]
      #   exit 0 = clean, exit 1 = any error.
      # The guard below keeps this job green until that script exists.
      - name: Validate keymaps
        run: |
          set -euo pipefail
          if [ ! -f editor/scripts/validate.ts ]; then
            echo "::notice::editor/scripts/validate.ts not present yet - validation skipped."
            exit 0
          fi
          rc=0
          for km in keyboards/*/*/keymaps/*/keymap.json; do
            kb_dir="$(dirname "$(dirname "$(dirname "$km")")")"
            echo "--- $km"
            npx --yes tsx editor/scripts/validate.ts "$km" --keyboard "$kb_dir/keyboard.json" || rc=1
          done
          exit $rc

  build:
    name: Build CandyPad firmware
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout userspace
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select userspace ref
        if: github.event.inputs.userspace_ref != ''
        run: |
          set -euo pipefail
          echo "Building keyboards/ + qmk.json from ref '${{ github.event.inputs.userspace_ref }}'"
          rm -rf keyboards qmk.json
          git checkout "${{ github.event.inputs.userspace_ref }}" -- keyboards qmk.json
          git --no-pager log -1 --oneline "${{ github.event.inputs.userspace_ref }}"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          # No requirements.txt in this repo; key the pip cache on the workflow,
          # which is where the qmk version and QMK_REF are pinned.
          cache-dependency-path: .github/workflows/build.yml

      - name: Install ARM toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            gcc-arm-none-eabi binutils-arm-none-eabi libnewlib-arm-none-eabi
          arm-none-eabi-gcc --version | head -1

      - name: Install QMK CLI
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install qmk
          qmk --version

      # Shallow clone + only the submodules an STM32/ChibiOS build needs.
      # (lufa = AVR, pico-sdk = RP2040, lvgl/googletest/vusb unused.)
      # No actions/cache: tarring ~1GB costs more than the fetch and the cache is branch-scoped.
      - name: Clone QMK firmware (binepad fork, pinned)
        run: |
          set -euo pipefail
          git init "$QMK_HOME"
          git -C "$QMK_HOME" remote add origin "https://github.com/${QMK_FORK}.git"
          git -C "$QMK_HOME" fetch --depth 1 --no-tags origin "$QMK_REF"
          git -C "$QMK_HOME" checkout --detach FETCH_HEAD
          git -C "$QMK_HOME" submodule update --init --depth 1 lib/chibios lib/chibios-contrib lib/printf
          python3 -m pip install -r "$QMK_HOME/requirements.txt"
          git -C "$QMK_HOME" --no-pager log -1 --oneline

      - name: Configure QMK userspace
        run: |
          set -euo pipefail
          qmk config user.qmk_home="$QMK_HOME"
          qmk config user.overlay_dir="$GITHUB_WORKSPACE"
          qmk config
          echo "--- bootloader / mcu as QMK resolves them (used by README flashing docs) ---"
          qmk info -kb binepad/candypad -f json > "$RUNNER_TEMP/kbinfo.json" || true
          jq '{bootloader, processor, board, bootloader_instructions}' "$RUNNER_TEMP/kbinfo.json" || true

      - name: Compile firmware
        run: |
          set -euo pipefail
          LOG="$RUNNER_TEMP/compile.log"
          if qmk userspace-compile --help >/dev/null 2>&1; then
            echo "compile-path=userspace-compile" | tee -a "$GITHUB_STEP_SUMMARY"
            qmk userspace-compile 2>&1 | tee "$LOG"
          else
            echo "compile-path=jq-loop-fallback" | tee -a "$GITHUB_STEP_SUMMARY"
            jq -r '.build_targets[] | @tsv' qmk.json | while IFS=$'\t' read -r kb km; do
              qmk compile -kb "$kb" -km "$km" 2>&1 | tee -a "$LOG"
            done
          fi

      - name: Build diagnostics (V1/V2 verification)
        if: always()
        run: |
          set +e
          LOG="$RUNNER_TEMP/compile.log"
          echo "===== redefinition warnings (expect none) ====="
          grep -nE "warning: .* redefined" "$LOG" || echo "(none)"
          echo
          echo "===== -flto on the command line ====="
          grep -om1 -- "-flto[^ ]*" "$LOG" | head -5 || echo "(not visible in log)"
          echo
          echo "===== feature flags mentioned in log ====="
          grep -nE "MOUSEKEY_ENABLE|ENCODER_MAP_ENABLE|LTO_ENABLE" "$LOG" | head -20 || echo "(none in log)"
          echo
          echo "===== generated rules/config mk ====="
          find "$QMK_HOME/.build" -name '*.mk' -maxdepth 4 -print -exec cat {} \; 2>/dev/null | head -200
          echo
          echo "===== objects that prove features are on ====="
          find "$QMK_HOME/.build" -name 'mousekey.o' -o -name 'encoder.o' -o -name 'keymap_introspection.o' 2>/dev/null
          echo
          echo "===== LTO sections in an object (definitive -flto check) ====="
          OBJ=$(find "$QMK_HOME/.build" -name 'keymap.o' | head -1)
          echo "object: $OBJ"
          if [ -n "$OBJ" ]; then
            arm-none-eabi-objdump -h "$OBJ" | grep -i "lto" || echo "(no .gnu.lto_* sections -> LTO NOT applied)"
          fi
          echo
          echo "===== generated keymap.c (V1 equivalence artifact) ====="
          find "$QMK_HOME/.build" -path '*/src/keymap.c' -print -exec cat {} \;
          exit 0

      - name: Collect firmware
        run: |
          set -euo pipefail
          mkdir -p firmware
          find "$QMK_HOME" "$GITHUB_WORKSPACE" -maxdepth 3 \
            \( -name '*.bin' -o -name '*.elf' -o -name '*.map' \) \
            -not -path '*/firmware/*' -print -exec cp {} firmware/ \;
          # generated C, for the keymap.c -> keymap.json equivalence diff
          find "$QMK_HOME/.build" -path '*/src/keymap.c' \
            -exec cp {} firmware/generated_keymap.c \; 2>/dev/null || true
          ls -l firmware/

      - name: Size report
        run: |
          set -euo pipefail
          BUDGET=${FLASH_BUDGET}
          {
            echo "## Firmware size"
            echo
            echo "| file | bytes | budget | used |"
            echo "|---|---:|---:|---:|"
          } >> "$GITHUB_STEP_SUMMARY"
          over=0
          shopt -s nullglob
          bins=(firmware/*.bin)
          if [ ${#bins[@]} -eq 0 ]; then
            echo "::error::no .bin produced"
            exit 1
          fi
          for bin in "${bins[@]}"; do
            size=$(stat -c %s "$bin")
            pct=$(awk -v s="$size" -v b="$BUDGET" 'BEGIN{printf "%.1f", 100*s/b}')
            echo "| \`$(basename "$bin")\` | $size | $BUDGET | ${pct}% |" >> "$GITHUB_STEP_SUMMARY"
            echo "$(basename "$bin"): $size / $BUDGET bytes (${pct}%)"
            if [ "$size" -gt "$BUDGET" ]; then
              echo "::error::$(basename "$bin") is $size bytes, over the ${BUDGET}-byte flash budget"
              over=1
            elif awk -v s="$size" -v b="$BUDGET" 'BEGIN{exit !(s >= 0.9*b)}'; then
              echo "::warning::$(basename "$bin") is at ${pct}% of the flash budget"
            fi
          done
          echo >> "$GITHUB_STEP_SUMMARY"
          for elf in firmware/*.elf; do
            {
              echo "<details><summary>arm-none-eabi-size -A $(basename "$elf")</summary>"
              echo
              echo '```'
              arm-none-eabi-size -A "$elf"
              echo '```'
              echo
              echo '</details>'
            } >> "$GITHUB_STEP_SUMMARY"
            arm-none-eabi-size -A "$elf"
          done
          exit $over

      - name: Upload firmware artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candypad-firmware${{ github.event.inputs.userspace_ref && format('-{0}', github.event.inputs.userspace_ref) || '' }}
          path: |
            firmware/*.bin
            firmware/*.elf
            firmware/*.map
            firmware/generated_keymap.c
          if-no-files-found: error
