name: Pages

on:
  push:
    branches: [main]
    paths:
      - 'editor/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel an in-flight Pages deploy: a half-applied deployment is worse than a slow one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: editor/package-lock.json

      - name: Install
        working-directory: editor
        run: npm ci

      - name: Build
        working-directory: editor
        run: npm run build
        env:
          VITE_COMMIT: ${{ github.sha }}

      - uses: actions/configure-pages@v6

      # `path` is an action input, not a shell cwd: working-directory does not apply to it.
      # v4+ drops dotfiles from the artifact; the Vite output has none, and Pages
      # deployed from an artifact never runs Jekyll, so no .nojekyll is needed either.
      - uses: actions/upload-pages-artifact@v5
        with:
          path: editor/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
